name: Build

# 可复用构建 workflow：解析版本 + 双架构构建 + 生成差分 + 上传 artifact。
# 由 release-draft.yml / release-pub.yml 调用，调用方各自做 release（草稿/正式/CDN）。

on:
  workflow_call:
    inputs:
      v:
        description: '显示版本（原大小写）'
        type: string
        required: true
      vl:
        description: '小写版本号（tag/目录名）'
        type: string
        required: true
      prerelease:
        description: '本次是否预发布（决定根 manifest 更新 latest 还是 latestPreview）'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:

  build:
    strategy:
      matrix:
        platform: [x64, arm64]
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build launcher
        run: msbuild src/Starshot.Launcher/Starshot.Launcher.vcxproj -p:Configuration=Release -p:Platform=${{ matrix.platform }}

      - name: Publish main app
        run: dotnet publish src/Starshot/Starshot.csproj -c Release -p:Platform=${{ matrix.platform }} -r win-${{ matrix.platform }}

      - name: Remove unuse
        run: |
          Remove-Item -Force build/release/app/RestartAgent.exe, build/release/app/DirectML.dll, build/release/app/onnxruntime.dll, build/release/app/onnxruntime_providers_shared.dll, build/release/app/Microsoft.ML.OnnxRuntime.dll, build/release/app/VP9DecoderMFT.dll -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build/release/app/NpuDetect -ErrorAction SilentlyContinue

      - name: Trim unsupported locales
        run: |
          # 从 Starshot.Language 的 Lang.{locale}.resx 读程序支持的语言（Lang.resx 是默认 en，主 dll 内无目录）
          $supported = Get-ChildItem src/Starshot.Language/Lang.*.resx | ForEach-Object {
            if ($_.Name -match '^Lang\.([a-z]{2}(-[A-Za-z0-9]+)?)\.resx$') { $Matches[1] }
          }
          Write-Host "Supported locales: $($supported -join ', ')"
          Get-ChildItem build/release/app -Directory | Where-Object {
            if ($supported -contains $_.Name) { return $false }
            try { [void][System.Globalization.CultureInfo]::GetCultureInfo($_.Name); return $true } catch { return $false }
          } | Remove-Item -Recurse -Force

      - name: Version layout
        run: |
          Move-Item build/release/app "build/release/app-${{ inputs.vl }}" -Force
          "version=${{ inputs.v }}" | Set-Content -Path build/release/version.ini -Encoding UTF8

      - name: Generate delta
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $newTag = "${{ inputs.vl }}"
          $arch = "${{ matrix.platform }}"
          $isPre = "${{ inputs.prerelease }}" -eq "true"

          # 读 release 历史（tag + prerelease 字段，倒序；/releases 默认不含 draft）
          # 不从版本号判断正式/预览——只认 release.prerelease 字段
          $raw = gh api repos/${{ github.repository }}/releases 2>$null
          $releases = if ($LASTEXITCODE -eq 0 -and $raw) { $raw | ConvertFrom-Json } else { $null }
          if (-not $releases) { Write-Host "No releases, skipping delta"; exit 0 }

          # 上一个 stable（prerelease=false 最近的）
          $prevStable = $releases | Where-Object { -not $_.prerelease } | Select-Object -First 1
          if (-not $prevStable) { Write-Host "No stable base release, skipping delta"; exit 0 }

          # 本集/本级 preview：上一个 stable 之后（更新于它）的所有 prerelease
          # releases 按发布时间倒序，prevStable 的 index 之前（index 更小=更新）的就是它之后的 prerelease
          $stableIdx = [array]::IndexOf($releases, $prevStable)
          $recentPreviews = @()
          if ($stableIdx -gt 0) {
            $recentPreviews = $releases[0..($stableIdx - 1)] | Where-Object { $_.prerelease }
          }

          # 选 diff target（线性发布；不解析版本号）
          # stable：本集 preview + 前 5 个 stable
          # preview：本级 preview + 上一个 stable（1 个）
          $targetTags = [System.Collections.Generic.List[string]]::new()
          foreach ($r in $recentPreviews) {
            if ($r.tag_name -ne $newTag -and -not $targetTags.Contains($r.tag_name)) { $targetTags.Add($r.tag_name) }
          }
          if ($isPre) {
            if (-not $targetTags.Contains($prevStable.tag_name)) { $targetTags.Add($prevStable.tag_name) }
          } else {
            $releases | Where-Object { -not $_.prerelease } | Select-Object -First 5 | ForEach-Object {
              if ($_.tag_name -ne $newTag -and -not $targetTags.Contains($_.tag_name)) { $targetTags.Add($_.tag_name) }
            }
          }

          if ($targetTags.Count -eq 0) { Write-Host "No delta target, skipping"; exit 0 }
          Write-Host "Delta targets ($($targetTags.Count)): $($targetTags -join ', ')"

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $newApp = "build/release/app-$newTag"
          if (!(Test-Path $newApp)) { Write-Host "New app folder missing, skipping delta"; exit 0 }
          $newRoot = (Resolve-Path $newApp).Path

          # new 的文件 hash 清单（所有 target 共用，只算一次）
          $newHashes = @{}
          Get-ChildItem $newRoot -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($newRoot.Length + 1).Replace('\','/')
            $newHashes[$rel] = (Get-FileHash $_.FullName).Hash
          }

          foreach ($oldTag in $targetTags) {
            Write-Host "--- delta: $oldTag -> $newTag ($arch) ---"
            $oldZip = "old-$oldTag.zip"
            gh release download $oldTag --pattern "Starshot-${oldTag}-win-${arch}.zip" --output $oldZip --repo ${{ github.repository }} 2>$null
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $oldZip)) {
              Write-Host "Skip ${oldTag}: prev release zip not found"
              continue
            }

            $oldDir = "old-$oldTag"
            if (Test-Path $oldDir) { Remove-Item $oldDir -Recurse -Force }
            Expand-Archive $oldZip -DestinationPath $oldDir -Force
            Remove-Item $oldZip -Force

            $oldApp = Join-Path $oldDir "app-$oldTag"
            if (!(Test-Path $oldApp)) {
              Write-Host "Skip ${oldTag}: app folder not found in prev zip"
              Remove-Item $oldDir -Recurse -Force -ErrorAction SilentlyContinue
              continue
            }
            $oldRoot = (Resolve-Path $oldApp).Path

            # 删除文件（old 有 new 没有，路径相对 app 目录）
            $deletedFiles = @()
            Get-ChildItem $oldRoot -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($oldRoot.Length + 1).Replace('\','/')
              if (-not $newHashes.ContainsKey($rel)) { $deletedFiles += "app-$newTag/$rel" }
            }

            # 变化/新增文件（hash 不同，路径相对 release 根目录）
            $changedFiles = @()
            foreach ($rel in $newHashes.Keys) {
              $oldFile = Join-Path $oldRoot $rel
              $newFile = Join-Path $newRoot $rel
              if (!(Test-Path $oldFile)) {
                $changedFiles += [PSCustomObject]@{ Path = "app-$newTag/$rel"; FullPath = $newFile }
              } elseif ((Get-FileHash $oldFile).Hash -ne $newHashes[$rel]) {
                $changedFiles += [PSCustomObject]@{ Path = "app-$newTag/$rel"; FullPath = $newFile }
              }
            }

            # launcher + version.ini 每次都变（C++ 构建元数据 + 版本号），无条件放 delta
            $changedFiles += [PSCustomObject]@{ Path = "Starshot.exe"; FullPath = "build/release/Starshot.exe" }
            $changedFiles += [PSCustomObject]@{ Path = "version.ini"; FullPath = "build/release/version.ini" }

            # diff 内 manifest：只放 deletedFiles（每 diff 特有）；files hash 共用一份，移到 CDN 版本 manifest，不进每个 diff zip
            $manifest = @{ deletedFiles = ($deletedFiles | Sort-Object) }
            $manifestPath = "manifest-$oldTag.json"
            $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath -Encoding UTF8

            $deltaZip = "diff-${newTag}-from-${oldTag}-win-${arch}.zip"
            if (Test-Path $deltaZip) { Remove-Item $deltaZip }
            $zipArchive = [System.IO.Compression.ZipFile]::Open($deltaZip, 'Create')
            try {
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zipArchive, $manifestPath, "manifest.json", [System.IO.Compression.CompressionLevel]::SmallestSize)
              foreach ($f in $changedFiles) {
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zipArchive, $f.FullPath, $f.Path, [System.IO.Compression.CompressionLevel]::SmallestSize)
              }
            } finally {
              $zipArchive.Dispose()
            }

            Remove-Item $manifestPath -Force
            Remove-Item $oldDir -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "delta: $deltaZip ($([math]::Round((Get-Item $deltaZip).Length / 1MB, 2)) MB), changed=$($changedFiles.Count) deleted=$($deletedFiles.Count)"
          }

          # 存 newHashes 给 upload-cdn 复用（upload-cdn 不再解压整包算第二遍）
          $sortedHashes = [ordered]@{}
          foreach ($k in ($newHashes.Keys | Sort-Object)) { $sortedHashes[$k] = $newHashes[$k] }
          $sortedHashes | ConvertTo-Json -Depth 10 | Set-Content "new-hashes-$arch.json"

      - name: Zip release
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = "Starshot-${{ inputs.vl }}-win-${{ matrix.platform }}.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          [System.IO.Compression.ZipFile]::CreateFromDirectory("build/release", $zip, [System.IO.Compression.CompressionLevel]::SmallestSize, $false)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starshot-${{ inputs.vl }}-win-${{ matrix.platform }}
          path: |
            Starshot-${{ inputs.vl }}-win-${{ matrix.platform }}.zip
            diff-*-win-${{ matrix.platform }}.zip
            new-hashes-${{ matrix.platform }}.json


  upload-cdn:
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: auto
      VL: ${{ inputs.vl }}
      PRE: ${{ inputs.prerelease }}
    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: Starshot-${{ inputs.vl }}-win-x64
          path: upload/
      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: Starshot-${{ inputs.vl }}-win-arm64
          path: upload/

      - name: List files
        run: ls -la upload/

      - name: Generate version manifest
        shell: pwsh
        run: |
          $vl = "$env:VL"
          $pre = "$env:PRE" -eq "true"
          $files = Get-ChildItem upload/ -Name

          # 复用 generate delta 已算好的 hash（new-hashes-{arch}.json 同 artifact 传来），不再解压整包
          function Read-Hashes($path) {
            if (Test-Path $path) { return Get-Content $path -Raw | ConvertFrom-Json } else { return [PSCustomObject]@{} }
          }
          $x64Files = Read-Hashes "upload/new-hashes-x64.json"
          $arm64Files = Read-Hashes "upload/new-hashes-arm64.json"

          $x64Full = ($files | Where-Object { $_ -eq "Starshot-$vl-win-x64.zip" }) | Select-Object -First 1
          $arm64Full = ($files | Where-Object { $_ -eq "Starshot-$vl-win-arm64.zip" }) | Select-Object -First 1
          $x64Diffs = @(); $arm64Diffs = @()
          $esc = [regex]::Escape($vl)
          foreach ($f in $files) {
            if ($f -match "^diff-$esc-from-(.+?)-win-x64\.zip$") {
              $x64Diffs += [PSCustomObject]@{ from = $Matches[1]; file = $f }
            } elseif ($f -match "^diff-$esc-from-(.+?)-win-arm64\.zip$") {
              $arm64Diffs += [PSCustomObject]@{ from = $Matches[1]; file = $f }
            }
          }
          $manifest = [PSCustomObject]@{
            tag = $vl
            prerelease = $pre
            publishedAt = (Get-Date).ToString("o")
            x64 = [PSCustomObject]@{ full = $x64Full; diffs = $x64Diffs; files = $x64Files }
            arm64 = [PSCustomObject]@{ full = $arm64Full; diffs = $arm64Diffs; files = $arm64Files }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content upload/manifest.json
          Write-Host "--- manifest.json ---"
          Get-Content upload/manifest.json

      - name: Upload version dir to CDN
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "::error::R2 secrets not configured (R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID / R2_BUCKET)"
            exit 1
          fi
          # 整包 + diff（zip）；manifest.json 排除，单独传（json content-type）
          aws s3 cp upload/ "s3://$R2_BUCKET/release/$VL/" \
            --endpoint-url "$R2_ENDPOINT" \
            --recursive \
            --exclude "manifest.json" \
            --exclude "new-hashes-*.json" \
            --content-type "application/zip" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "upload/manifest.json" "s3://$R2_BUCKET/release/$VL/manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Update root manifest (latest / latestPreview)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # 拉根 manifest（不存在则建空）
          aws s3 cp "s3://$R2_BUCKET/manifest.json" ./root-manifest.json --endpoint-url "$R2_ENDPOINT" 2>/dev/null \
            || echo '{"latest":"","latestPreview":""}' > root-manifest.json
          # 正式版更新 latest，预览版更新 latestPreview
          if [ "$PRE" = "true" ]; then
            jq --arg v "$VL" '.latestPreview = $v' root-manifest.json > tmp.json && mv tmp.json root-manifest.json
          else
            jq --arg v "$VL" '.latest = $v' root-manifest.json > tmp.json && mv tmp.json root-manifest.json
          fi
          echo "--- root manifest.json ---"; cat root-manifest.json
          aws s3 cp root-manifest.json "s3://$R2_BUCKET/manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=60"
