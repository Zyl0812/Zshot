name: Release Draft

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false
      version:
        description: 'Version (e.g. 0.1.0; leave empty to auto-increment from latest stable release)'
        required: false

permissions:
  contents: write

# 同名 group 串行执行，避免两次手动 dispatch 同时读到同一个"上一个 release"
# 算出相同版本号，撞车创建同名 tag。不 cancel-in-progress：新的排队等，不打断正在跑的构建
concurrency:
  group: release
  cancel-in-progress: false

jobs:

  resolve-version:
    uses: ./.github/workflows/resolve-version.yml
    with:
      prerelease: ${{ inputs.prerelease }}
      version: ${{ inputs.version }}
    secrets: inherit

  build:
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    with:
      v: ${{ needs.resolve-version.outputs.v }}
      vl: ${{ needs.resolve-version.outputs.vl }}
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit

  release:
    needs: [resolve-version, build]
    runs-on: windows-2025-vs2026
    steps:
      - name: Download x64
        uses: actions/download-artifact@v4
        with:
          name: Starshot-${{ needs.resolve-version.outputs.vl }}-win-x64
          path: x64
      - name: Download arm64
        uses: actions/download-artifact@v4
        with:
          name: Starshot-${{ needs.resolve-version.outputs.vl }}-win-arm64
          path: arm64

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.vl }}
          name: ${{ needs.resolve-version.outputs.v }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            x64/Starshot-${{ needs.resolve-version.outputs.vl }}-win-x64.zip
            arm64/Starshot-${{ needs.resolve-version.outputs.vl }}-win-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
